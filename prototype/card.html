<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>小美的集章卡 · 小傑想做的事</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap detail card-page" data-friend="小美" data-token="8f3k2q">
  <header class="top">
    <a class="brand back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      小傑想做的事
    </a>
  </header>

  <main class="main">
    <p class="context">這是你的集章卡，只有你跟小傑看得到。存起來，之後按「我也想」會自動知道是你。</p>

    <h1 class="h2">小美的集章卡</h1>
    <p class="one">你跟小傑一起做過這些事。</p>

    <section class="stamps" aria-label="集章">
      <div class="stamp-grid" id="stamp-grid"></div>
      <p class="hand stamp-note" id="stamp-note"></p>
    </section>

    <section class="block">
      <p class="label">小傑券</p>
      <div id="coupons"></div>
      <p class="muted" style="font-size:14px;margin:12px 0 0">每集滿 3 章解鎖一張。章不會被扣掉，券不會過期。</p>
    </section>

    <section class="block">
      <p class="label">章的來歷</p>
      <ul class="timeline" id="stamp-list"></ul>
    </section>

    <section class="block">
      <p class="label">想再蓋一章？</p>
      <a class="btn secondary" href="index.html#ideas">看看小傑還想做什麼 →</a>
    </section>
  </main>
</div>

<div class="backdrop" data-close></div>
<div class="sheet" id="redeem-sheet" role="dialog" aria-modal="true" aria-labelledby="redeem-title" aria-hidden="true">
  <div class="handle"></div>
  <div id="redeem-form-view">
    <h2 id="redeem-title">這張券要換什麼</h2>
    <p class="sub">選一個，小傑會來找你約。</p>
    <form id="redeem-form" novalidate>
      <div class="field">
        <div class="menu" role="radiogroup" aria-label="兌換項目">
          <label><input type="radio" name="item" value="drink"><span><b>請你一杯飲料</b><small>手搖、咖啡、啤酒都算</small></span></label>
          <label><input type="radio" name="item" value="help"><span><b>幫你一件事</b><small>一小時內做得完的那種</small></span></label>
          <label><input type="radio" name="item" value="pick"><span><b>下一個企劃你來指定</b><small>你說想做什麼，小傑負責揪</small></span></label>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit" id="redeem-submit" disabled>跟小傑說</button>
      </div>
      <p class="cancel-row"><button type="button" class="linkish" data-close>先不換</button></p>
    </form>
  </div>
  <div id="redeem-ok" class="hidden">
    <div class="success">
      <div class="stamp big-stamp" aria-hidden="true"><span class="e">🎟️</span><span class="d">已申請</span></div>
      <h2>收到！小傑會來找你約。</h2>
      <p class="muted" style="margin:4px 0 0;font-size:15px">兌現之後這張券會變成灰色，章還是你的。</p>
      <p class="back"><button type="button" class="linkish" data-close>回到集章卡</button></p>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
