<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>小傑想做的事</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">小傑想做的事</a>
    <nav><a href="#about">關於</a></nav>
  </header>

  <section class="intro">
    <h1 class="h1"><span>嗨，我是小傑。</span><span>這裡放著我<em class="hl" style="font-style:normal">想做但還沒做</em>的事。</span><span>看到想一起的，按一下跟我說。</span></h1>
    <p class="hand">↳ 不用登入，也不算報名</p>
  </section>

  <section class="section" id="live">
    <p class="label">正在發生</p>
    <div class="cards wide" id="live-cards"></div>
  </section>

  <section class="section" id="ideas">
    <p class="label">想做的事 · <b id="idea-count">0</b></p>
    <div class="chips" id="chips" role="group" aria-label="分類"></div>
    <div class="cards" id="idea-cards"></div>
  </section>

  <section class="section" id="done">
    <p class="label">一起做過的</p>
    <div class="done-grid">
      <a class="done-card" href="done.html">
        <div class="ph"><img src="https://picsum.photos/seed/island/800/600" alt=""></div>
        <p class="t">去蘭嶼待一週</p>
        <p class="d">2025.08</p>
        <p class="q">什麼都沒排，結果每天都很滿。</p>
      </a>
      <a class="done-card" href="done.html">
        <div class="ph"><img src="https://picsum.photos/seed/homecooking/800/600" alt=""></div>
        <p class="t">一起做年菜</p>
        <p class="d">2025.02</p>
        <p class="q">佛跳牆失敗，但炸年糕成功。</p>
      </a>
      <a class="done-card" href="done.html">
        <div class="ph"><img src="https://picsum.photos/seed/exhibition/800/600" alt=""></div>
        <p class="t">在家辦一場小展</p>
        <p class="d">2024.12</p>
        <p class="q">來了 23 個人，客廳差點塞爆。</p>
      </a>
      <a class="done-card" href="done.html">
        <div class="ph"><img src="https://picsum.photos/seed/bicycle/800/600" alt=""></div>
        <p class="t">騎車去淡水看日出</p>
        <p class="d">2024.10</p>
        <p class="q">日出沒看到，早餐很好吃。</p>
      </a>
    </div>
    <p class="closing">下次換你一起。<a href="#ideas">看看還沒做的 →</a></p>
  </section>

  <footer class="site" id="about">
    這是小傑的個人網站。想法都是真的，日期大多還沒確定。有問題直接找我。
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
